server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/html,text/css
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/cipherchat_db;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:SA}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 120000
      max-lifetime: 180000
      connection-timeout: 20000
  sql:
    init:
      mode: always
      continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  h2:
    console:
      enabled: true
      path: /h2-console