server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/html,text/css
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/cipherchat_db;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:SA}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console